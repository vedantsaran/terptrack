name: Curated Source Evidence

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run the daily strict sample or the full artifact-writing sweep.
        required: true
        default: sample
        type: choice
        options:
          - sample
          - full
      seed:
        description: Stable seed prefix for the live source sweep.
        required: false
        default: workflow-curated-source
      artifact_date:
        description: Stable generatedAt label for uploaded JSON artifacts.
        required: false
        default: ''
      sample_limit:
        description: Number of seeded curated courses to check in sample mode.
        required: false
        default: '80'

permissions:
  contents: read
  issues: write

concurrency:
  group: curated-source-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  curated-source-evidence:
    name: Strict curated source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve sweep settings
        shell: bash
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || '' }}"
          SEED="${{ github.event.inputs.seed || '' }}"
          ARTIFACT_DATE="${{ github.event.inputs.artifact_date || '' }}"
          SAMPLE_LIMIT="${{ github.event.inputs.sample_limit || '' }}"

          if [ -z "$MODE" ]; then MODE="sample"; fi
          case "$MODE" in
            sample|full) ;;
            *) echo "::error::mode must be sample or full"; exit 1 ;;
          esac

          if [ -z "$SEED" ]; then SEED="workflow-curated-source"; fi
          if [ -z "$ARTIFACT_DATE" ]; then ARTIFACT_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; fi
          case "$SAMPLE_LIMIT" in
            ''|*[!0-9]*) SAMPLE_LIMIT="80" ;;
          esac
          if [ "$SAMPLE_LIMIT" -lt 1 ]; then SAMPLE_LIMIT="80"; fi

          {
            echo "MODE=$MODE"
            echo "SEED=$SEED"
            echo "ARTIFACT_DATE=$ARTIFACT_DATE"
            echo "SAMPLE_LIMIT=$SAMPLE_LIMIT"
          } >> "$GITHUB_ENV"

      - name: Preserve committed baseline artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/curated-catalog-sweep
          cp artifacts/curated-catalog-sweep/latest.json artifacts/curated-catalog-sweep/baseline.json
          if [ "${MODE}" = "full" ]; then
            rm -f artifacts/curated-catalog-sweep/latest.json
          fi

      - name: Run strict scheduled sample
        if: env.MODE == 'sample'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-release-checks.js \
            --skip-syntax \
            --skip-proxy \
            --skip-generated \
            --skip-curated \
            --skip-rendered \
            --skip-workflows \
            --live-curated-catalog-sweep \
            --live-curated-catalog-limit="${SAMPLE_LIMIT}" \
            --live-curated-catalog-strict-titles \
            --live-curated-catalog-strict-credit-source \
            --live-curated-catalog-artifact=artifacts/curated-catalog-sweep/sample.json \
            --live-curated-catalog-artifact-date="${ARTIFACT_DATE}" \
            --live-seed="${SEED}-sample"

      - name: Run full strict artifact sweep
        if: env.MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-release-checks.js \
            --skip-rendered \
            --skip-workflows \
            --live-curated-catalog-sweep \
            --live-curated-catalog-strict-titles \
            --live-curated-catalog-strict-credit-source \
            --live-curated-catalog-write-artifact \
            --live-curated-catalog-artifact-date="${ARTIFACT_DATE}" \
            --live-seed="${SEED}-full"

      - name: Compare full artifact sweep
        id: drift
        if: always() && env.MODE == 'full'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/curated-catalog-sweep/latest.json ]; then
            {
              echo "## Curated catalog source evidence"
              echo
              echo "**The full sweep failed before producing a comparison artifact.** Review the workflow logs and uploaded baseline evidence."
            } > artifacts/curated-catalog-sweep/summary.md
            cat artifacts/curated-catalog-sweep/summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/compare-curated-catalog-artifacts.js \
            artifacts/curated-catalog-sweep/baseline.json \
            artifacts/curated-catalog-sweep/latest.json \
            --json > artifacts/curated-catalog-sweep/diff.json
          node scripts/compare-curated-catalog-artifacts.js \
            artifacts/curated-catalog-sweep/baseline.json \
            artifacts/curated-catalog-sweep/latest.json \
            --markdown > artifacts/curated-catalog-sweep/summary.md
          cat artifacts/curated-catalog-sweep/summary.md >> "$GITHUB_STEP_SUMMARY"

          if node scripts/compare-curated-catalog-artifacts.js \
            artifacts/curated-catalog-sweep/baseline.json \
            artifacts/curated-catalog-sweep/latest.json \
            --fail-on-drift \
            --limit=20; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update source drift issue
        if: always() && env.MODE == 'full' && steps.drift.outputs.changed == 'true'
        uses: actions/github-script@v9
        env:
          DRIFT_ISSUE_TITLE: TerpTrack curated catalog source drift
          DRIFT_SUMMARY_PATH: artifacts/curated-catalog-sweep/summary.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terptrack-curated-source-drift -->';
            const summary = fs.readFileSync(process.env.DRIFT_SUMMARY_PATH, 'utf8').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              summary,
              '',
              `Workflow run: ${runUrl}`,
              `Commit: \`${context.sha}\``,
              '',
              'Review the uploaded baseline, latest, and diff artifacts before changing curated schedules.',
            ].join('\n');
            const { data: openIssues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request && (
                issue.title === process.env.DRIFT_ISSUE_TITLE
                || String(issue.body || '').includes(marker)
              )
            );
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
              core.notice(`Updated drift issue #${existing.number}.`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                ...context.repo,
                title: process.env.DRIFT_ISSUE_TITLE,
                body,
              });
              core.notice(`Opened drift issue #${issue.number}.`);
            }

      - name: Upload curated source artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curated-source-evidence-${{ github.run_id }}-${{ env.MODE }}
          path: |
            artifacts/curated-catalog-sweep/baseline.json
            artifacts/curated-catalog-sweep/latest.json
            artifacts/curated-catalog-sweep/sample.json
            artifacts/curated-catalog-sweep/diff.json
            artifacts/curated-catalog-sweep/summary.md
          if-no-files-found: warn
          retention-days: 30
